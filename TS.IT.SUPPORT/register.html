<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — TS IT Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .auth-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 30%, rgba(14,143,130,.08), transparent 50%), #F7F8FA;
    padding: 24px;
  }
  .auth-box {
    background: #fff;
    border: 1px solid #E9ECF1;
    border-radius: 18px;
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 60px rgba(15,23,42,.10);
  }
  .auth-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 28px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: #101826;
  }
  .auth-title {
    font-family: var(--font-sans);
    font-size: 21px;
    font-weight: 800;
    color: #101826;
    margin-bottom: 5px;
  }
  .auth-sub {
    font-size: 12.5px;
    color: #8592AA;
    margin-bottom: 26px;
    line-height: 1.5;
  }
  .auth-field {
    margin-bottom: 13px;
  }
  .auth-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #6C789A;
    margin-bottom: 6px;
  }
  .auth-field input {
    width: 100%;
    background: #F7F8FA;
    border: 1.5px solid #E2E5EA;
    border-radius: 10px;
    padding: 11px 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: #101826;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .auth-field input:focus {
    border-color: var(--teal);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(14,143,130,.10);
  }
  .auth-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--teal), var(--teal-d));
    color: #fff;
    border: none;
    border-radius: 11px;
    padding: 13px;
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity .2s, transform .2s;
    box-shadow: 0 8px 20px rgba(14,143,130,.28);
  }
  .auth-btn:hover { transform: translateY(-2px); }
  .auth-btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: #C5CBDA;
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #E9ECF1;
  }

  .social-btn {
    width: 100%;
    border: 1.5px solid #E2E5EA;
    border-radius: 11px;
    padding: 11px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: #fff;
    color: #374151;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 9px;
    transition: border-color .2s, box-shadow .2s;
  }
  .social-btn:hover { border-color: #101826; box-shadow: 0 4px 12px rgba(0,0,0,.06); }
  .social-btn svg { width: 18px; height: 18px; }

  .auth-err {
    background: rgba(229,99,122,.10);
    border: 1.5px solid rgba(229,99,122,.25);
    border-radius: 9px;
    padding: 10px 13px;
    font-size: 12px;
    color: var(--red);
    margin-top: 12px;
    display: none;
    line-height: 1.5;
  }
  .auth-switch {
    text-align: center;
    margin-top: 22px;
    font-size: 12px;
    color: #8592AA;
  }
  .auth-switch a {
    color: var(--teal-d);
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .auth-switch a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-brand">
      <span class="mark" style="width:28px;height:28px;font-size:11px;">TS</span>
      TS IT SUPPORT
    </div>
    <div class="auth-title">Create your account</div>
    <div class="auth-sub">Track orders, manage your mailbox, and get support — all in one place.</div>

    <!-- Social sign-up -->
    <button class="social-btn" id="googleBtn">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <button class="social-btn" id="facebookBtn">
      <svg viewBox="0 0 24 24" fill="#1877F2" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
      Continue with Facebook
    </button>

    <div class="divider">or sign up with email</div>

    <div class="auth-field">
      <label>Full name</label>
      <input type="text" id="regName" placeholder="e.g. Rahim Uddin" autocomplete="name">
    </div>
    <div class="auth-field">
      <label>Email address</label>
      <input type="email" id="regEmail" placeholder="you@company.com" autocomplete="email">
    </div>
    <div class="auth-field">
      <label>Password</label>
      <input type="password" id="regPass" placeholder="Min. 6 characters" autocomplete="new-password">
    </div>

    <button class="auth-btn" id="regBtn">Create account</button>
    <div class="auth-err" id="regErr"></div>

    <div class="auth-switch">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</div>

<script type="module">
import {
  auth, googleProvider, facebookProvider,
  createUserWithEmailAndPassword, signInWithPopup, updateProfile, onAuthStateChanged
} from './firebase-config.js';

// If already logged in, redirect to mailbox
onAuthStateChanged(auth, user => {
  if (user) location.href = 'mailbox.html';
});

function showErr(msg) {
  const el = document.getElementById('regErr');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideErr() { document.getElementById('regErr').style.display = 'none'; }
function setLoading(on) {
  const btn = document.getElementById('regBtn');
  btn.disabled = on;
  btn.textContent = on ? 'Creating account…' : 'Create account';
}

// Email/Password signup
document.getElementById('regBtn').addEventListener('click', async () => {
  hideErr();
  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass  = document.getElementById('regPass').value;

  if (!name)  { showErr('Please enter your full name.'); return; }
  if (!email) { showErr('Please enter your email address.'); return; }
  if (pass.length < 6) { showErr('Password must be at least 6 characters.'); return; }

  setLoading(true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    location.href = 'mailbox.html';
  } catch (e) {
    const msgs = {
      'auth/email-already-in-use': 'This email is already registered. Try signing in.',
      'auth/invalid-email': 'Please enter a valid email address.',
      'auth/weak-password': 'Password is too weak. Use at least 6 characters.',
    };
    showErr(msgs[e.code] || 'Something went wrong. Please try again.');
    setLoading(false);
  }
});

// Google signup
document.getElementById('googleBtn').addEventListener('click', async () => {
  hideErr();
  try {
    await signInWithPopup(auth, googleProvider);
    location.href = 'mailbox.html';
  } catch (e) {
    if (e.code !== 'auth/popup-closed-by-user') {
      showErr('Google sign-in failed. Please try again.');
    }
  }
});

// Facebook signup
document.getElementById('facebookBtn').addEventListener('click', async () => {
  hideErr();
  try {
    await signInWithPopup(auth, facebookProvider);
    location.href = 'mailbox.html';
  } catch (e) {
    if (e.code !== 'auth/popup-closed-by-user') {
      showErr('Facebook sign-in failed. Please try again.');
    }
  }
});

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('regBtn').click();
});
</script>
</body>
</html>
