<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — TS IT Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 36px 36px;
    width: 100%;
    max-width: 380px;
  }
  .login-brand {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
  }
  .login-title {
    font-family: var(--font-sans);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .login-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .login-field {
    margin-bottom: 14px;
  }
  .login-field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .login-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 13px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    outline: none;
    box-sizing: border-box;
    transition: border-color .2s;
  }
  .login-field input:focus {
    border-color: var(--teal-bright);
  }
  .login-btn {
    width: 100%;
    background: var(--teal-bright);
    color: #0B1220;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .06em;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity .2s;
  }
  .login-btn:hover { opacity: .88; }
  .login-btn:disabled { opacity: .5; cursor: not-allowed; }
  .login-err {
    background: rgba(229,99,122,.12);
    border: 1px solid rgba(229,99,122,.3);
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 12px;
    color: var(--red);
    margin-top: 12px;
    display: none;
  }
  .login-back {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }
  .login-back span { color: var(--teal-bright); cursor: pointer; }
  .login-back span:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <span class="mark" style="width:26px;height:26px;font-size:10px;">TS</span>
      TSADMIN
    </div>
    <div class="login-title">Admin sign in</div>
    <div class="login-sub">Only authorized staff can access the dashboard.</div>

    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign in to dashboard</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-back">← <span onclick="location.href='index.html'">Back to storefront</span></div>
  </div>
</div>

<script>
// Hard-coded admin credentials
const ADMIN_EMAIL = 'ts@admin.com';
const ADMIN_PASS  = 'Mysweety@007#12';

function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('loginErr');
  err.style.display = 'none';

  if(!email || !pass){
    err.textContent = 'Please enter email and password.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  setTimeout(()=>{
    if(email === ADMIN_EMAIL && pass === ADMIN_PASS){
      sessionStorage.setItem('ts_admin_auth', '1');
      location.href = 'admin.html';
    } else {
      err.textContent = 'Incorrect email or password.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in to dashboard';
    }
  }, 600);
}

// Enter key support
document.addEventListener('keydown', e => {
  if(e.key === 'Enter') doLogin();
});

// Already logged in → skip to dashboard
if(sessionStorage.getItem('ts_admin_auth') === '1'){
  location.href = 'admin.html';
}
</script>
</body>
</html>
