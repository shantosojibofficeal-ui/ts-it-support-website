<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — TS IT Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0B1220;}
  .login-box{background:#12192C;border:1px solid #1E2A44;border-radius:14px;padding:40px 36px 36px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4);}
  .login-brand{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.08em;color:#E7ECF5;display:flex;align-items:center;gap:8px;margin-bottom:28px;}
  .login-title{font-family:var(--font-sans);font-size:20px;font-weight:700;color:#E7ECF5;margin-bottom:6px;}
  .login-sub{font-size:12px;color:#6C789A;margin-bottom:28px;}
  .login-field{margin-bottom:14px;}
  .login-field label{display:block;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6C789A;margin-bottom:6px;}
  .login-field input{width:100%;background:#0B1220;border:1px solid #1E2A44;border-radius:8px;padding:10px 13px;font-family:var(--font-mono);font-size:13px;color:#E7ECF5;outline:none;box-sizing:border-box;transition:border-color .2s;}
  .login-field input:focus{border-color:var(--teal-bright);}
  .login-btn{width:100%;background:linear-gradient(135deg,var(--teal-bright),var(--teal-d));color:#0B1220;border:none;border-radius:8px;padding:11px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;margin-top:6px;transition:opacity .2s;}
  .login-btn:hover{opacity:.88;} .login-btn:disabled{opacity:.5;cursor:not-allowed;}
  .login-err{background:rgba(229,99,122,.12);border:1px solid rgba(229,99,122,.3);border-radius:7px;padding:9px 12px;font-size:12px;color:var(--red);margin-top:12px;display:none;}
  .login-back{text-align:center;margin-top:20px;font-size:11px;color:#6C789A;}
  .login-back span{color:var(--teal-bright);cursor:pointer;} .login-back span:hover{text-decoration:underline;}
  .admin-note{background:rgba(63,224,208,.07);border:1px solid rgba(63,224,208,.15);border-radius:7px;padding:9px 12px;font-size:11px;color:#6C789A;margin-bottom:20px;line-height:1.5;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-brand">
      <span class="mark" style="width:26px;height:26px;font-size:10px;background:linear-gradient(135deg,var(--teal-bright),var(--teal-d));color:#0B1220;">TS</span>
      TSADMIN
    </div>
    <div class="login-title">Admin sign in</div>
    <div class="login-sub">Authorized staff only.</div>
    <div class="admin-note">🔒 Verified via Firebase Authentication. Admin emails are whitelisted.</div>

    <div class="login-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">Sign in to dashboard</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-back">← <span onclick="location.href='index.html'">Back to storefront</span></div>
  </div>
</div>

<script type="module">
import { auth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from './firebase-config.js';

const ADMIN_EMAILS = ['ts@admin.com'];

onAuthStateChanged(auth, user => {
  if(user && ADMIN_EMAILS.includes(user.email)){
    location.href = 'admin.html';
  }
});

function showErr(msg){ const el=document.getElementById('loginErr'); el.textContent=msg; el.style.display='block'; }

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const btn   = document.getElementById('loginBtn');
  document.getElementById('loginErr').style.display='none';
  if(!email||!pass){ showErr('Please enter email and password.'); return; }
  btn.disabled=true; btn.textContent='Signing in…';
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    if(ADMIN_EMAILS.includes(cred.user.email)){
      location.href = 'admin.html';
    } else {
      await signOut(auth);
      showErr('Access denied. This account does not have admin privileges.');
      btn.disabled=false; btn.textContent='Sign in to dashboard';
    }
  } catch(e){
    const msgs={'auth/invalid-credential':'Incorrect email or password.','auth/user-not-found':'No admin account found.','auth/wrong-password':'Incorrect password.','auth/too-many-requests':'Too many failed attempts. Please wait.'};
    showErr(msgs[e.code]||'Sign-in failed. Please try again.');
    btn.disabled=false; btn.textContent='Sign in to dashboard';
  }
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
